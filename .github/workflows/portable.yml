name: Portable package

# Builds Priestess-Bot-<tag>-windows-x64.zip (the bot with its own Python and libraries) and
# attaches it to the release. Runs when a release is published; "Run workflow" rebuilds one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach to (e.g. v1.1.0)
        required: true

permissions:
  contents: write # to upload the zip to the release

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14" # same minor version as PYTHON_VERSION in tools/build_portable.py
      - name: Build and test the package
        run: python tools/build_portable.py --version "$env:TAG" --test
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-Item build/*.zip).FullName --clobber
